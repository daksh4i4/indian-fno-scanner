services:
  - type: web
    name: indian-fno-scanner
    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: GROWW_API_KEY
        sync: false

      - key: GROWW_API_SECRET
        sync: false
